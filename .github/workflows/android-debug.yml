name: Android QA + Closed-Test Audit

on:
  push:
    branches:
      - main
      - 'qa/**'
      - 'fix/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Stable QA signing audit
        shell: bash
        run: |
          set -euo pipefail
          test -f keystores/vidsize-qa-debug.jks
          expected="8C:CB:0E:A9:8D:2B:17:1E:8C:9A:D3:24:C9:F6:D2:F2:0D:53:FD:C8:02:C9:24:75:DF:EB:71:AE:FA:D7:20:E0"
          actual="$(keytool -list -v \
            -keystore keystores/vidsize-qa-debug.jks \
            -storepass vidsize-qa-debug-2026 \
            -alias vidsizeqa 2>/dev/null \
            | awk '/SHA256:/ {print $2; exit}')"
          echo "QA signing certificate SHA256: $actual"
          test "$actual" = "$expected"

      - name: Source policy audit
        shell: bash
        run: |
          set -euo pipefail
          legacy_brand="fit""size"
          legacy_package="com\\.fit""size"
          if grep -RIniE "${legacy_brand}|${legacy_package}" app docs README.md store --exclude='*.png'; then
            echo 'Legacy brand reference found.' >&2
            exit 1
          fi
          ! grep -q 'FOREGROUND_SERVICE_DATA_SYNC' app/src/main/AndroidManifest.xml
          ! grep -q 'foregroundServiceType="[^"]*dataSync' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/data_extraction_rules.xml
          grep -q 'android:minHeight="18dp"' app/src/main/res/layout/native_ad_result.xml
          grep -Fq 'android:value="${ADMOB_APP_ID}"' app/src/main/AndroidManifest.xml
          grep -q 'minSdk = 29' app/build.gradle.kts
          grep -q 'versionCode = 19' app/build.gradle.kts
          grep -q 'versionName = "0.9.1"' app/build.gradle.kts
          grep -q 'create("closedTest")' app/build.gradle.kts
          grep -q 'USE_TEST_ADS", "true"' app/build.gradle.kts
          grep -q 'USE_TEST_ADS", "false"' app/build.gradle.kts
          grep -q 'VIDSIZE_APP_OPEN_AD_UNIT_ID' app/build.gradle.kts
          grep -q 'verifyProductionAdConfig' app/build.gradle.kts
          grep -q 'AdIds.appOpen' app/src/main/java/com/vidsize/compressor/ads/AppOpenAdManager.kt
          grep -q 'AdIds.nativeResult' app/src/main/java/com/vidsize/compressor/ads/NativeAdLoader.kt
          grep -q 'AdIds.homeBanner' app/src/main/java/com/vidsize/compressor/ui/components/HomeBannerAd.kt
          grep -q 'CompressionBannerAd(active = !processing)' app/src/main/java/com/vidsize/compressor/ui/screens/CompressionScreen.kt
          test "$(grep -c 'CompressionBannerAd(active = !processing)' app/src/main/java/com/vidsize/compressor/ui/screens/CompressionScreen.kt)" -eq 1
          grep -q 'setAdSize(AdSize.BANNER)' app/src/main/java/com/vidsize/compressor/ui/components/HomeBannerAd.kt
          ! grep -q 'getLargeAnchoredAdaptiveBannerAdSize' app/src/main/java/com/vidsize/compressor/ui/components/HomeBannerAd.kt
          grep -q 'ic_launcher_monochrome' app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          test -f store/assets/icon-512.png
          test -f docs/index.html
          test -f app/src/main/assets/legal/index.html
          cmp -s docs/privacy.html app/src/main/assets/legal/privacy.html
          cmp -s docs/terms.html app/src/main/assets/legal/terms.html
          cmp -s docs/index.html app/src/main/assets/legal/index.html

      - name: v0.9.0 ad model regression gates
        shell: bash
        run: |
          set -euo pipefail
          ADS=app/src/main/java/com/vidsize/compressor/ads
          UI=app/src/main/java/com/vidsize/compressor/ui
          RESULT=$UI/screens/ResultScreen.kt
          COMPRESS=$UI/screens/CompressionScreen.kt
          SETTINGS=$UI/screens/SettingsSheet.kt
          MAIN=app/src/main/java/com/vidsize/compressor/MainActivity.kt

          # --- Gate 1: exactly one pacing rule in code, and it is 60 seconds ---
          # The whole model rests on this. Four stacked conditions are what made
          # the v0.8.9 app-open ad unreachable and undiagnosable.
          grep -q 'FULL_SCREEN_GAP_MILLIS: Long = 60L \* 1000L' $ADS/AdPacing.kt

          # --- Gate 2: no silent quota has crept back in ---
          # A forbidden-name list, because every one of these returned false
          # without a trace and the outcome was indistinguishable from no fill.
          for banned in INSTALL_GRACE MIN_SESSIONS_BEFORE COOLDOWN_MILLIS DAILY_LIMIT \
                        SESSION_QUOTA MAX_PER_SESSION MAX_PER_DAY FREE_USES MIN_COMPRESSIONS; do
            if grep -rqn "$banned" $ADS; then
              echo "Silent quota reintroduced in ads/: $banned" >&2
              exit 1
            fi
          done

          # --- Gate 3: the reward duration is stated in exactly one place ---
          grep -q 'REWARD_DURATION_MINUTES: Int = 10' $ADS/AdFreeWindow.kt
          grep -q 'REWARD_DURATION_MILLIS: Long = 10L \* 60L \* 1000L' $ADS/AdFreeWindow.kt
          # ...and no locale states it independently (enforced by the Gradle task).
          grep -q 'verifyRewardCopyParity' app/build.gradle.kts
          for f in app/src/main/res/values*/strings.xml; do
            grep -q 'name="ad_free_title">[^<]*%1\$d' "$f" || { echo "$f hardcodes the reward duration" >&2; exit 1; }
          done

          # --- Gate 4: one chokepoint; no surface asks its own question ---
          # A banner that decided for itself is what would have let an ad-free
          # window silence the full-screen formats and leave the banner running.
          grep -q 'AdSlots.requestable' $UI/components/HomeBannerAd.kt
          grep -q 'AdSlots.requestable' $UI/components/NativeAdCard.kt
          grep -q 'AdSlots.requestable' $ADS/NativeAdLoader.kt
          # v0.9.1: Home no longer carries the anchored banner - it keeps the
          # rewarded offer and the in-content native. The progress panel keeps
          # its banner; that surface is the longest-dwell one in the app.
          ! grep -q 'HomeBannerAd' $UI/screens/HomeScreen.kt
          grep -q 'AdSlots.bannerVisible' $UI/screens/ProcessingOverlay.kt
          grep -q 'CompressionBannerAd' $UI/screens/ProcessingOverlay.kt
          ! grep -q 'ConsentManager' $UI/components/HomeBannerAd.kt
          ! grep -q 'ConsentManager' $UI/screens/ProcessingOverlay.kt

          # --- Gate 5: preloading still happens while the job runs ---
          test "$(grep -c 'InterstitialAds.preload(context)' $COMPRESS)" -eq 2

          # --- Gate 6: the three deferred exits are still deferred ---
          # If any of these reverts to suppressAppOpenOnReturn alone, the
          # interstitial silently stops earning on its most common path.
          test "$(grep -c 'context.deferInterstitialOnReturn()' $RESULT)" -eq 3
          ! grep -q 'suppressAppOpenOnReturn' $RESULT
          # ...and both immediate exits from the result screen carry one too, so
          # "an interstitial after every compression" is true for every path a
          # user can actually take out of a finished job, not just some of them.
          test "$(grep -c 'context.findHostActivity()?.let(InterstitialAds::showNow)' $COMPRESS)" -eq 2

          # The rewarded offer appears on all three surfaces that can convert:
          # before a job (Home, Compression) and straight after one (Result),
          # which is where it converts best because the cost it removes is the
          # one the user just paid.
          grep -q 'AdFreeStrip' $UI/screens/HomeScreen.kt
          grep -q 'AdFreeStrip' $COMPRESS
          grep -q 'AdFreeStrip' $RESULT
          # It must stay ABOVE the ad section, or it reads as part of the
          # creative instead of as an offer from the app.
          test "$(grep -n 'AdFreeStrip' $RESULT | tail -1 | cut -d: -f1)" \
             -lt "$(grep -n 'NativeAdCard' $RESULT | tail -1 | cut -d: -f1)"
          # The in-content native at the end of the home scroll must not reserve
          # space it may never fill.
          grep -q 'reserveSpace = false' $UI/screens/HomeScreen.kt

          # --- Gate 7: no ad in front of content, and ordering is preserved ---
          # reset() must precede showNow(): AdGate refuses a full-screen ad while
          # the job is non-idle, so the reverse order fails on every attempt.
          grep -Pzoq 'CompressionJobState\.reset\(\)\n\s*context\.findHostActivity\(\)\?\.let\(InterstitialAds::showNow\)' $COMPRESS
          grep -q 'Verdict.RUNNING_JOB' $ADS/AdGate.kt
          grep -q 'Verdict.RESULT_WAITING' $ADS/AdGate.kt
          grep -q 'requireIdleJob = true' $ADS/AppOpenAdPolicy.kt

          # --- Gate 7b: a system back gesture never answers with an ad -------
          # The in-app arrow carries the interstitial; the platform gesture must
          # not. Same destination, two callbacks, and the gesture's one must stay
          # free of any show call.
          grep -q 'BackHandler { onSystemBack() }' $RESULT
          grep -Pzoq 'onSystemBack = \{ CompressionJobState\.reset\(\) \},' $COMPRESS
          ! grep -Pzoq 'onSystemBack[\s\S]{0,120}?InterstitialAds' $COMPRESS

          # --- Gate 7c: growth surfaces are wired --------------------------
          # The share-sheet path has existed since v0.8.x and was never
          # mentioned in the UI. A caption is the whole retention story here.
          grep -q 'hero_share_hint' $UI/screens/HomeScreen.kt
          for f in app/src/main/res/values*/strings.xml; do
            grep -q 'name="hero_share_hint"' "$f" || { echo "$f lacks hero_share_hint" >&2; exit 1; }
          done
          # Play review asked at the result, never on the exit the ad owns.
          test -f app/src/main/java/com/vidsize/compressor/growth/ReviewPrompt.kt
          grep -q 'ReviewPrompt.maybeAsk' $RESULT
          ! grep -q 'ReviewPrompt' $COMPRESS
          grep -q 'review-ktx' app/build.gradle.kts

          # --- Gate 8: the share-sheet entry point still suppresses app open ---
          grep -q 'appOpenAdManager.suppressNextForeground()' $MAIN
          grep -q 'InterstitialAds.showPendingIfAny(this)' $MAIN

          # --- Gate 9: diagnostics exists and is reachable from a signed build ---
          grep -q 'DIAGNOSTICS_TAP_COUNT = 7' $SETTINGS
          grep -q 'AdDiagnosticsSheet' $SETTINGS
          test -f $UI/screens/AdDiagnosticsSheet.kt
          grep -q 'VERDICT' $UI/screens/AdDiagnosticsSheet.kt

          # --- Gate 10: real units only; the ads-off-without-ids invariant holds ---
          grep -q 'VIDSIZE_INTERSTITIAL_AD_UNIT_ID' app/build.gradle.kts
          grep -q 'VIDSIZE_REWARDED_AD_UNIT_ID' app/build.gradle.kts
          grep -q 'verifyAdUnitCoverage' app/build.gradle.kts
          grep -q 'verifyAdsOffWithoutRealIds' app/build.gradle.kts
          # closedTest must no longer be pinned ads-off, or T1-T7 cannot be run
          # against the artefact that ships.
          ! grep -Pzoq 'create\("closedTest"\)[\s\S]{0,600}?ENABLE_ADS", "false"' app/build.gradle.kts
          # ...and the test-creative variant must be debuggable, or AdIds' sample
          # backstop refuses every unit and the variant shows nothing.
          grep -Pzoq 'create\("adsQa"\)[\s\S]{0,400}?isDebuggable = true' app/build.gradle.kts

          # --- Gate 11: no real AdMob identifier is ever committed -----------
          # The audit guarantee: a clone must package with ads OFF. Only Google's
          # sample publisher and the all-zero placeholder may appear in tracked
          # source. A real one leaking in would silently arm the SDK for anyone
          # who builds the repo.
          # Allowed publishers, and why each is safe:
          #   3940256099942544 - Google's public sample publisher
          #   0000000000000000 - the all-zero placeholder
          #   1111111111111111 - the repeated-digit dummy this workflow's own
          #                      negative tests pass to bundleRelease
          # Anything else is a live publisher and must never be committed.
          ALLOWED_PUBS='3940256099942544|0000000000000000|1111111111111111'
          leaked="$(grep -rhoE 'ca-app-pub-[0-9]{16}' \
                      app/src docs app/build.gradle.kts .github 2>/dev/null \
                    | sort -u | grep -vE "ca-app-pub-($ALLOWED_PUBS)" || true)"
          if [ -n "$leaked" ]; then
            echo "Live AdMob publisher committed to source:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          grep -qx 'ads.properties' .gitignore
          test -f ads.properties.example
          ! git ls-files --error-unmatch ads.properties >/dev/null 2>&1

          # --- Gate 12: required and optional identifier sets are as designed --
          # App Open is optional because this account has no unit for it; making
          # it required would take the other four formats down with it.
          grep -q 'val requiredAdIds' app/build.gradle.kts
          grep -q 'val optionalAdIds' app/build.gradle.kts
          grep -Pzoq 'val optionalAdIds[\s\S]{0,300}?VIDSIZE_APP_OPEN_AD_UNIT_ID' app/build.gradle.kts
          grep -Pzoq 'val requiredAdIds[\s\S]{0,400}?VIDSIZE_INTERSTITIAL_AD_UNIT_ID' app/build.gradle.kts
          grep -Pzoq 'val requiredAdIds[\s\S]{0,400}?VIDSIZE_REWARDED_AD_UNIT_ID' app/build.gradle.kts

          # --- Gate 13: the published policy declares every format and the reward ---
          for term in 'Banner' 'Result-screen ad' 'App-open ad' 'Interstitial' 'Rewarded ad' \
                      'no ads of any kind' '10 minutes' '60 seconds'; do
            grep -Fq "$term" docs/privacy.html || { echo "privacy.html omits: $term" >&2; exit 1; }
          done
          cmp -s docs/privacy.html app/src/main/assets/legal/privacy.html

      - name: v0.8.3 compression + v0.8.4 UI + v0.8.5 quality/ad guards
        shell: bash
        run: |
          set -euo pipefail
          PLANNER=app/src/main/java/com/vidsize/compressor/media/CompressionPlanner.kt
          PRESET=app/src/main/java/com/vidsize/compressor/model/CompressionPreset.kt
          ENGINE=app/src/main/java/com/vidsize/compressor/media/CompressionEngine.kt
          SERVICE=app/src/main/java/com/vidsize/compressor/media/CompressionService.kt
          SCREEN=app/src/main/java/com/vidsize/compressor/ui/screens/CompressionScreen.kt
          OVERLAY=app/src/main/java/com/vidsize/compressor/ui/screens/ProcessingOverlay.kt
          NATIVE=app/src/main/java/com/vidsize/compressor/ui/components/NativeAdCard.kt
          RESULT=app/src/main/java/com/vidsize/compressor/ui/screens/ResultScreen.kt
          HOME=app/src/main/java/com/vidsize/compressor/ui/screens/HomeScreen.kt
          PROBE=app/src/main/java/com/vidsize/compressor/media/VideoProbe.kt
          INFO=app/src/main/java/com/vidsize/compressor/model/VideoInfo.kt
          RING=app/src/main/java/com/vidsize/compressor/ui/components/ProgressRing.kt
          BANNER=app/src/main/java/com/vidsize/compressor/ui/components/HomeBannerAd.kt
          TESTS=app/src/test/java/com/vidsize/compressor/media/CompressionPlannerTest.kt

          # Strip KDoc/line comments so these guards test code, not prose.
          # Written through a temp file, never a pipe: `set -o pipefail` plus
          # `grep -q` makes the upstream grep die with SIGPIPE and fails the step
          # even when the pattern was found.
          BUF="$(mktemp)"
          codeof()  { grep -vE '^[[:space:]]*(\*|/\*|//)' "$1" > "$BUF"; }
          has()     { codeof "$1"; grep -Fq -- "$2" "$BUF"; }
          nothas()  { codeof "$1"; ! grep -Fq -- "$2" "$BUF"; }
          hasre()   { codeof "$1"; grep -Eq -- "$2" "$BUF"; }
          nothasre(){ codeof "$1"; ! grep -Eq -- "$2" "$BUF"; }

          # BLOCKER 1.1 - the shared absolute video-bitrate floor must never return.
          nothas "$PLANNER" 'const val MIN_VIDEO_BITRATE'
          has    "$PRESET"  'minSourceShare'
          has    "$PLANNER" 'minSourceShare'

          # 1.1 - the estimate must not be clamped to the source size again.
          nothas "$PLANNER" 'coerceAtMost(info.sourceBytes'
          has    "$PLANNER" 'viable ='

          # 1.2 - the parametrised ordering test must exist and cover low bitrate.
          grep -Fq 'presetsAreStrictlyOrderedAcrossTheWholeBitrateRange' "$TESTS"
          grep -Fq 'LOW-BITRATE' "$TESTS"
          grep -Fq 'real704pExampleDoesNotCollapseBalancedAndSmaller' "$TESTS"
          grep -Fq 'real720pExampleDoesNotCollapseBalancedAndSmaller' "$TESTS"

          # 2.1 - the native ad slot must stay reserved.
          has "$NATIVE" 'heightIn(min = AdSlotMinHeight)'

          # 3.1 - the job must still start in the unknown-progress state.
          has "$SERVICE" 'markRunning(progressKnown = false)'
          grep -Fq 'progressKnown: Boolean = true' app/src/main/java/com/vidsize/compressor/media/CompressionJobState.kt

          # 3.2 - the MediaStore copy must stay cancellable.
          has    "$ENGINE" 'ensureActive()'
          nothas "$ENGINE" 'copyTo(out)'

          # 3.3 / 3.4 - start feedback and stale-state reset.
          has "$SCREEN" 'var starting by remember'
          has "$SCREEN" 'CompressionJobState.reset()'

          # 4.1 - out-of-space detection must walk the cause chain.
          has "$SERVICE" 'current.cause'
          has "$SERVICE" 'ErrnoException'

          # 4.2 - stopSelf must be start-id scoped.
          nothasre "$SERVICE" 'stopSelf\(\)'
          has      "$SERVICE" 'stopSelf(startId)'

          # 5.3 - R8 keep rules for the native ad layout.
          grep -Fq 'nativead' app/proguard-rules.pro

          # localisation completeness for the new string
          for f in app/src/main/res/values*/strings.xml; do
            grep -Fq 'preset_not_viable' "$f" || { echo "missing preset_not_viable in $f" >&2; exit 1; }
          done

          # ==================== v0.8.4 UI regression guards ====================

          # 1 - the processing panel has exactly ONE call site. Two call sites put
          # it in two composition slots, so crossing from preparing to running
          # rebuilt the panel and every animation inside it restarted, which read
          # on-device as a second compression starting from 1%.
          test "$(grep -c 'ProcessingOverlay(' "$SCREEN")" -eq 1
          has "$SCREEN" 'if (processing) {'
          has "$SCREEN" 'val processing = busy || starting'

          # 1 - no pseudo-progress during preparation. The old fixed 72-degree
          # accent arc is gone from the ring and from every call site.
          nothas "$RING"    'indeterminateSweep'
          nothas "$OVERLAY" 'indeterminateSweep'
          has    "$RING"    'trackOnly'
          has    "$OVERLAY" 'trackOnly = !progressKnown'
          nothasre "$RING"  'sweepAngle = 72'

          # 2 - the processing panel carries the compression banner, reusing the
          # standard 320x50 AdSize.BANNER infrastructure and its consent gate.
          has "$OVERLAY" 'CompressionBannerAd('
          has "$BANNER"  'setAdSize(AdSize.BANNER)'
          has "$BANNER"  'AdIds.compressionBanner'
          # v0.9.0 supersedes the old `has "$OVERLAY" 'ConsentManager'` check.
          # The intent was "this surface respects consent"; it now does so
          # through the single AdSlots chokepoint, which is strictly stronger -
          # it covers consent AND the rewarded ad-free window. Asserting the
          # literal ConsentManager reference would now force the surface to
          # re-derive the condition itself, which is the exact divergence the
          # chokepoint exists to prevent.
          has "$OVERLAY" 'AdSlots.bannerVisible'
          # exactly one banner call site inside the overlay
          test "$(grep -c 'CompressionBannerAd(' "$OVERLAY")" -eq 1
          # and no full-screen ad format anywhere on this surface
          nothas "$OVERLAY" 'Interstitial'
          nothas "$OVERLAY" 'AppOpenAd'

          # 3 - the result is a real full-screen page, not a constrained dialog.
          test -f "$RESULT"
          test ! -f app/src/main/java/com/vidsize/compressor/ui/screens/ResultSheet.kt
          has    "$RESULT" 'fun ResultScreen('
          nothas "$RESULT" 'Dialog('
          nothas "$RESULT" 'DialogProperties'
          nothas "$RESULT" 'BoxWithConstraints'
          nothas "$RESULT" 'Alignment.BottomCenter'
          nothas "$RESULT" '0.94f'
          nothas "$RESULT" 'sheetMaxHeight'
          has    "$RESULT" 'fillMaxSize()'
          has    "$RESULT" 'statusBarsPadding()'
          has    "$RESULT" 'navigationBarsPadding()'
          has    "$RESULT" 'verticalScroll('
          has    "$SCREEN" 'ResultScreen('
          nothas "$SCREEN" 'ResultSheet('

          # 3 - back from the result must clear the finished job state.
          has "$RESULT" 'BackHandler'
          # v0.9.0: this asserted the exact one-liner
          # `onBack = { CompressionJobState.reset() }`. The handler now also
          # shows an interstitial, so it spans several lines - but the invariant
          # being protected is unchanged and is checked more directly below:
          # reset() still runs, and it still runs FIRST. The ordering is not
          # cosmetic. AdGate refuses a full-screen ad while the job is non-idle,
          # so a future edit that shows before resetting would be declined on
          # every attempt and look exactly like no fill.
          grep -Pzoq 'onBack = \{\n\s*CompressionJobState\.reset\(\)\n\s*context\.findHostActivity\(\)\?\.let\(InterstitialAds::showNow\)\n\s*\}' "$SCREEN"

          # 4 - the native ad keeps its reserved slot and its one-time binding,
          # and the page can scroll far enough to expose the whole creative.
          has "$NATIVE" 'AdSlotMinHeight'
          has "$NATIVE" 'heightIn(min = AdSlotMinHeight)'
          has "$NATIVE" 'it.bind(ad)'
          # setNativeAd must be reachable only from the one-shot bind(), never
          # from AndroidView's update block.
          test "$(grep -c 'setNativeAd(' "$NATIVE")" -eq 1
          has "$NATIVE" 'nativeAd?.destroy()'
          has "$RESULT" 'NativeAdCard('

          # no new permissions may sneak in with a UI change
          test "$(grep -c 'uses-permission' app/src/main/AndroidManifest.xml)" -eq 5

          # ==================== v0.8.5 guards ====================

          # Q2 - the flat per-preset bitrate cap is gone. On 16 Mbps phone
          # footage it, not sourceBitrateFactor, decided the output, so a
          # quality-first Balanced produced 31% of the source.
          nothas "$PRESET"  'bitrateCap'
          nothas "$PLANNER" 'preset.bitrateCap'
          has    "$PRESET"  'qualityBitsPerPixel'
          has    "$PRESET"  'bitrateCeiling'
          has    "$PLANNER" 'qualityCeiling'
          has    "$PLANNER" 'targetWidth'

          # Q2 - the ceiling must react to frame rate and to the source codec.
          has "$PLANNER" 'frameRate'
          has "$PLANNER" 'EFFICIENT_CODEC_CEILING_FACTOR'
          has "$INFO"    'frameRate'
          has "$INFO"    'usesEfficientCodec'
          has "$PROBE"   'METADATA_KEY_VIDEO_FRAME_COUNT'
          has "$PROBE"   'MediaExtractor'

          # Q2 - the v0.8.3 low-bitrate protections must remain untouched.
          has "$PRESET"  'minSourceShare'
          has "$PLANNER" 'minSourceShare'
          nothas "$PLANNER" 'const val MIN_VIDEO_BITRATE'
          nothas "$PLANNER" 'coerceAtMost(info.sourceBytes'
          grep -Fq 'lowBitrateSourcesAreUntouchedByTheQualityCeiling' "$TESTS"
          grep -Fq 'highBitrate1080pIsNoLongerPinnedToTheOldFlatCap' "$TESTS"
          grep -Fq 'higherFrameRateRaisesTheQualityCeiling' "$TESTS"
          grep -Fq 'efficientSourceCodecRaisesTheQualityCeiling' "$TESTS"

          # v0.8.8 / QA v0.8.7 BUG-06 + "ad density on the result screen".
          #
          # v0.8.5 put the ad between the primary action and the secondary ones,
          # which left "Show in Gallery" and "Open Video" below a full-height
          # creative and therefore off screen on a 720x1600 device. Every route
          # back to the compressed file must now come BEFORE the ad section, and
          # the save location must be stated in-app rather than only in the
          # completion notification.
          has "$RESULT" 'R.string.ad_label'
          has "$RESULT" 'HairLine()'
          AD_LINE="$(grep -n 'NativeAdCard(' "$RESULT" | head -1 | cut -d: -f1)"
          ANOTHER_LINE="$(grep -n 'R.string.result_another' "$RESULT" | head -1 | cut -d: -f1)"
          LOCATION_LINE="$(grep -n 'R.string.result_location' "$RESULT" | head -1 | cut -d: -f1)"
          SHARE_LINE="$(grep -n 'R.string.result_share' "$RESULT" | head -1 | cut -d: -f1)"
          GALLERY_LINE="$(grep -n 'R.string.result_show_in_gallery' "$RESULT" | head -1 | cut -d: -f1)"
          OPEN_LINE="$(grep -n 'R.string.result_open' "$RESULT" | head -1 | cut -d: -f1)"
          test "$LOCATION_LINE" -lt "$SHARE_LINE"
          test "$SHARE_LINE" -lt "$GALLERY_LINE"
          test "$GALLERY_LINE" -lt "$OPEN_LINE"
          test "$OPEN_LINE" -lt "$AD_LINE"
          test "$AD_LINE" -lt "$ANOTHER_LINE"

          # Q3 - the anchored home banner keeps a divider and a dead buffer
          # between the creative and the system navigation area.
          has "$BANNER" 'SystemEdgeBuffer'
          has "$BANNER" 'navigationBarsPadding()'
          has "$HOME"   'HairLine()'

          # Q4 - the v0.8.4 processing transition must not have been touched.
          test "$(grep -c 'ProcessingOverlay(' "$SCREEN")" -eq 1
          has "$OVERLAY" 'trackOnly = !progressKnown'
          has "$OVERLAY" 'CompressionBannerAd('

          # ==================== v0.8.8 guards (QA v0.8.7) ====================

          ADIDS=app/src/main/java/com/vidsize/compressor/ads/AdIds.kt
          SLOTS=app/src/main/java/com/vidsize/compressor/ads/AdSlots.kt
          ENCSUP=app/src/main/java/com/vidsize/compressor/media/EncoderSupport.kt
          ALIGN=app/src/main/java/com/vidsize/compressor/media/FrameAlignment.kt
          FAILURES=app/src/main/java/com/vidsize/compressor/media/CompressionFailures.kt
          STATE=app/src/main/java/com/vidsize/compressor/media/CompressionJobState.kt
          HISTMODEL=app/src/main/java/com/vidsize/compressor/data/history/HistoryModels.kt
          HISTCTRL=app/src/main/java/com/vidsize/compressor/data/history/HistoryController.kt
          HISTREPO=app/src/main/java/com/vidsize/compressor/data/history/PrefsHistoryRepository.kt
          ROOT=app/src/main/java/com/vidsize/compressor/ui/VidsizeRoot.kt
          ALIGNTESTS=app/src/test/java/com/vidsize/compressor/media/FrameAlignmentTest.kt

          # BUG-03 - the 2px "force transcode" nudge must never come back. It
          # cost every output 4x2 px, moved the display aspect ratio off 16:9,
          # compounded on re-compression, and produced non-aligned geometry.
          nothas "$PLANNER" 'FORCE_TRANSCODE_DELTA_PX'
          nothasre "$PLANNER" 'sourceShortEdge - '
          grep -Fq 'bitrateOnlyReductionKeepsTheSourceResolutionExactly' "$TESTS"
          grep -Fq 'recompressionDoesNotCompoundAResolutionLoss' "$TESTS"
          grep -Fq 'displayAspectRatioIsPreserved' "$TESTS"
          grep -Fq 'portraitAndOddRatioSourcesAlsoKeepTheirExactGeometry' "$TESTS"

          # BUG-05 - the encoder is asked for a frame the DEVICE confirmed it
          # supports, both edges are passed explicitly, the bitrate is clamped
          # into the codec's own range, and a failed export is retried before
          # the user is told anything went wrong.
          test -f "$ENCSUP"
          test -f "$ALIGN"
          has "$ENGINE"  'Presentation.createForWidthAndHeight'
          nothas "$ENGINE" 'Presentation.createForHeight'
          has "$ENGINE"  'EncoderSupport.fitToEncoder'
          has "$ENGINE"  'EncoderSupport.clampBitrate'
          has "$ENGINE"  'runExportWithFallbacks'
          has "$ENCSUP"  'isSizeSupported'
          has "$ENCSUP"  'widthAlignment'
          has "$ENCSUP"  'bitrateRange'
          has "$ALIGN"   'fun fit('
          # The alignment arithmetic must stay free of Android imports so it is
          # testable on the JVM, and it must actually be tested.
          nothas "$ALIGN" 'import android.'
          test -f "$ALIGNTESTS"
          grep -Fq 'theQaResolutionMatrixIsReproducedExactly' "$ALIGNTESTS"
          grep -Fq 'noOutputEdgeIsEverOdd' "$ALIGNTESTS"

          # BUG-05 - a failure must be MODAL. v0.8.7 appended it to the bottom
          # of a scrolling column, where it was off screen on the test device,
          # so a failed compression looked exactly like a dead button.
          has "$FAILURES" 'class EncoderUnsupportedException'
          has "$STATE"    'ENCODER_UNSUPPORTED'
          has "$SCREEN"   'AlertDialog('
          has "$SCREEN"   'FailureDialog('
          # The v0.8.7 shape - a failure card appended inside the scrolling
          # column, with its detail line hidden behind BuildConfig.DEBUG - must
          # not come back.
          nothas "$SCREEN" 'failure.debugMessage.takeIf'
          # and the reason a disabled button is disabled must be next to it.
          has "$SCREEN" 'hint = when {'
          has "$SCREEN" 'R.string.cta_blocked_no_savings'

          # BUG-01 / BUG-02 - no ad slot may render without the build-level
          # switch, and no Google sample unit may be returned outside debug.
          test -f "$SLOTS"
          has "$ADIDS"  'BuildConfig.ENABLE_ADS'
          has "$ADIDS"  'GOOGLE_SAMPLE_PUBLISHER'
          has "$ADIDS"  'isGoogleSample'
          # v0.9.0: these four asserted the literal `AdSlots.enabled`. The
          # invariant being protected was "no slot renders without the
          # build-level switch", and it still holds - `requestable` and
          # `bannerVisible` are both defined as `enabled && ...`, so they are
          # strictly narrower. Pinning the weaker spelling would now block the
          # ad-free window from ever reaching these surfaces, which is the one
          # thing v0.9.0 had to guarantee.
          has "$NATIVE" 'AdSlots.requestable'
          has "$BANNER" 'AdSlots.requestable'
          has "$RESULT" 'AdSlots.requestable'
          has "$HOME"   'AdSlots.requestable'
          # ...and the definitions themselves still start from the build switch.
          grep -Fq 'val enabled: Boolean get() = BuildConfig.ENABLE_ADS' "$SLOTS"
          grep -Fq 'enabled && ConsentManager.adsAllowed' "$SLOTS"
          grep -Fq 'googleSamplePublisher' app/build.gradle.kts
          grep -Fq 'adsConfigured' app/build.gradle.kts
          grep -Fq 'verifyAdsOffWithoutRealIds' app/build.gradle.kts

          # BUG-06 / BUG-07 - recent rows are a real route back to the file,
          # and rows whose file is gone leave storage instead of being counted
          # by the "Storage saved" total for ever.
          has "$HOME"      'combinedClickable'
          has "$HOME"      'onOpenEntry'
          has "$ROOT"      'onOpenEntry'
          has "$HISTMODEL" 'fun remove(id: Long)'
          has "$HISTREPO"  'override fun remove('
          has "$HISTCTRL"  'repository.remove('
          # v0.8.9: Android 11+ trashes media instead of deleting it, and a
          # trashed file still opens. Existence must be decided by the
          # MediaStore row, never by a file descriptor alone.
          has "$HISTCTRL"  'IS_TRASHED'
          has "$HISTCTRL"  'IS_PENDING'
          has "$HISTCTRL"  'contentResolver.query('

          # BUG-08 - nothing on the result screen accepts a tap for the first
          # instant after it replaces the progress dialog.
          has "$RESULT" 'ARRIVAL_GUARD_MS'
          has "$RESULT" 'enabled = interactive'

          # BUG-09 - the estimate factor is recalibrated and named, not a
          # magic literal buried in an expression.
          has "$PLANNER" 'ENCODER_VARIANCE = 1.22'

          # UX - the save location is stated in-app, and a disabled level says
          # why it is disabled.
          has "$RESULT" 'R.string.result_location'
          has "$SCREEN" 'R.string.preset_not_viable_hint'

          # localisation completeness for every string added in v0.8.8
          for f in app/src/main/res/values*/strings.xml; do
            for key in error_encoder_unsupported cta_blocked_no_savings \
                       cta_blocked_no_space cta_blocked_level cta_pick_another \
                       preset_not_viable_hint error_unreadable_title \
                       notice_no_savings_title result_recent_hint; do
              grep -Fq "\"$key\"" "$f" || {
                echo "missing $key in $f" >&2
                exit 1
              }
            done
          done

      - name: Debug QA gate
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleAdsQa --stacktrace

      - name: Closed-test runtime-safe AAB gate
        run: gradle :app:lintClosedTest :app:bundleClosedTest --stacktrace

      # The production guard used to be untested: bundleRelease never ran in CI,
      # so nothing proved verifyProductionAdConfig actually fires.
      - name: Production ad guard must FAIL without real AdMob IDs
        shell: bash
        run: |
          set +e
          gradle :app:bundleRelease --stacktrace
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'verifyProductionAdConfig did not fire - release built with no AdMob IDs.' >&2
            exit 1
          fi
          echo "Production guard fired as expected (exit ${status})."

      # QA v0.8.7 BUG-01: v0.8.7 reached real users carrying Google's sample
      # publisher in every ad slot, so every user saw "Test Ad" and the
      # developer earned nothing. verifyProductionAdConfig now refuses to
      # package a release containing that publisher at all. These two steps
      # prove both halves of that guard.
      - name: Production ad guard must FAIL on Google sample identifiers
        shell: bash
        run: |
          set +e
          gradle :app:bundleRelease --stacktrace \
            -PVIDSIZE_ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713 \
            -PVIDSIZE_HOME_BANNER_AD_UNIT_ID=ca-app-pub-3940256099942544/9214589741 \
            -PVIDSIZE_COMPRESSION_BANNER_AD_UNIT_ID=ca-app-pub-3940256099942544/9214589741 \
            -PVIDSIZE_NATIVE_RESULT_AD_UNIT_ID=ca-app-pub-3940256099942544/2247696110 \
            -PVIDSIZE_APP_OPEN_AD_UNIT_ID=ca-app-pub-3940256099942544/9257395921
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'A release bundle was packaged with Google sample ad units.' >&2
            exit 1
          fi
          echo "Sample-identifier guard fired as expected (exit ${status})."

      - name: Release build must SUCCEED with non-sample AdMob IDs
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:bundleRelease --stacktrace \
            -PVIDSIZE_ADMOB_APP_ID=ca-app-pub-1111111111111111~2222222222 \
            -PVIDSIZE_HOME_BANNER_AD_UNIT_ID=ca-app-pub-1111111111111111/3333333333 \
            -PVIDSIZE_COMPRESSION_BANNER_AD_UNIT_ID=ca-app-pub-1111111111111111/4444444444 \
            -PVIDSIZE_NATIVE_RESULT_AD_UNIT_ID=ca-app-pub-1111111111111111/5555555555 \
            -PVIDSIZE_APP_OPEN_AD_UNIT_ID=ca-app-pub-1111111111111111/6666666666 \
            -PVIDSIZE_INTERSTITIAL_AD_UNIT_ID=ca-app-pub-1111111111111111/7777777777 \
            -PVIDSIZE_REWARDED_AD_UNIT_ID=ca-app-pub-1111111111111111/8888888888

      - name: New gates must FAIL when broken (negative tests)
        shell: bash
        run: |
          set -uo pipefail
          # A gate nobody has watched fail is not a gate. Each case below breaks
          # the invariant on purpose, asserts the check fires, and restores the
          # working tree before the next one.
          ADS=app/src/main/java/com/vidsize/compressor/ads
          TR=app/src/main/res/values-tr/strings.xml

          restore() { git checkout -- "$@"; }

          # --- 1. A reintroduced silent quota must be caught -----------------
          cp $ADS/AdPacing.kt /tmp/AdPacing.kt.bak
          printf '\nprivate const val COOLDOWN_MILLIS = 21600000L\n' >> $ADS/AdPacing.kt
          if ! grep -rq 'COOLDOWN_MILLIS' $ADS; then
            echo 'negative test 1 did not break anything' >&2; exit 1
          fi
          caught=0
          for banned in INSTALL_GRACE MIN_SESSIONS_BEFORE COOLDOWN_MILLIS DAILY_LIMIT; do
            grep -rq "$banned" $ADS && caught=1
          done
          cp /tmp/AdPacing.kt.bak $ADS/AdPacing.kt
          test "$caught" -eq 1 || { echo 'GATE 2 DID NOT FIRE' >&2; exit 1; }
          echo 'ok: silent-quota gate fires'

          # --- 2. A translation that states the duration must be caught ------
          cp $TR /tmp/strings-tr.bak
          sed -i 's|<string name="ad_free_title">[^<]*</string>|<string name="ad_free_title">15 dakika reklamsiz</string>|' $TR
          if grep -q 'name="ad_free_title">[^<]*%1[$]d' $TR; then
            cp /tmp/strings-tr.bak $TR
            echo 'GATE 3 DID NOT FIRE: hardcoded duration went unnoticed' >&2; exit 1
          fi
          cp /tmp/strings-tr.bak $TR
          echo 'ok: reward-duration parity gate fires'

          # --- 3. An incomplete identifier set must not package a release ----
          # This is the trap the two new slots create: supply the legacy five and
          # every format - banners included - switches off with nothing said.
          set +e
          gradle :app:bundleRelease --stacktrace \
            -PVIDSIZE_ADMOB_APP_ID=ca-app-pub-1111111111111111~2222222222 \
            -PVIDSIZE_HOME_BANNER_AD_UNIT_ID=ca-app-pub-1111111111111111/3333333333 \
            -PVIDSIZE_COMPRESSION_BANNER_AD_UNIT_ID=ca-app-pub-1111111111111111/4444444444 \
            -PVIDSIZE_NATIVE_RESULT_AD_UNIT_ID=ca-app-pub-1111111111111111/5555555555 \
            -PVIDSIZE_APP_OPEN_AD_UNIT_ID=ca-app-pub-1111111111111111/6666666666
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'A release packaged with the interstitial and rewarded units missing.' >&2
            exit 1
          fi
          echo "ok: incomplete identifier set rejected (exit ${status})"

          # The tree must be exactly as checked out before the audit ZIP is cut.
          test -z "$(git status --porcelain)" || {
            echo 'negative tests left the working tree dirty:' >&2
            git status --porcelain >&2
            exit 1
          }

      - name: Create exact source audit ZIP
        shell: bash
        run: git archive --format=zip --output=vidsize-v089-source-audit.zip HEAD

      - name: Upload QA APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidsize-v089-qa-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: warn

      - name: Upload UNSIGNED closed-test audit AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidsize-v089-closed-test-UNSIGNED-audit-aab
          path: app/build/outputs/bundle/closedTest/*.aab
          if-no-files-found: warn

      - name: Upload source audit ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidsize-v089-source-audit
          path: vidsize-v089-source-audit.zip
          if-no-files-found: warn

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidsize-v089-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-closedTest.html
          if-no-files-found: ignore
