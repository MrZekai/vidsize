name: Android QA Build

on:
  push:
    branches:
      - main
      - 'qa/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Stable QA signing audit
        shell: bash
        run: |
          set -euo pipefail
          test -f keystores/vidsize-qa-debug.jks
          expected="8C:CB:0E:A9:8D:2B:17:1E:8C:9A:D3:24:C9:F6:D2:F2:0D:53:FD:C8:02:C9:24:75:DF:EB:71:AE:FA:D7:20:E0"
          actual="$(keytool -list -v \
            -keystore keystores/vidsize-qa-debug.jks \
            -storepass vidsize-qa-debug-2026 \
            -alias vidsizeqa 2>/dev/null \
            | awk '/SHA256:/ {print $2; exit}')"
          echo "QA signing certificate SHA256: $actual"
          test "$actual" = "$expected"

      - name: Source policy audit
        shell: bash
        run: |
          set -euo pipefail
          legacy_brand="fit""size"
          legacy_package="com\\.fit""size"
          if grep -RIniE "${legacy_brand}|${legacy_package}" app docs README.md store --exclude='*.png'; then
            echo 'Legacy brand reference found.' >&2
            exit 1
          fi
          ! grep -q 'FOREGROUND_SERVICE_DATA_SYNC' app/src/main/AndroidManifest.xml
          ! grep -q 'foregroundServiceType="[^"]*dataSync' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'minSdk = 29' app/build.gradle.kts
          grep -q 'const val ENABLED = true' app/src/main/java/com/vidsize/compressor/ads/AppOpenAdPolicy.kt
          grep -q 'vidsize-qa-debug.jks' app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("qaDebug")' app/build.gradle.kts

      - name: Unit tests, lint and debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidsize-v070-stable-qa-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidsize-v070-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
