name: Production - Signed Vidsize AAB + APK

on:
  workflow_dispatch:
    inputs:
      shrink:
        description: >-
          Shrinking. "full" is the release setting. The other two are
          DIAGNOSTICS for isolating a shrinking-related crash and must never
          be uploaded to Play: "code" keeps R8 but turns resource shrinking
          off, "none" turns both off.
        type: choice
        default: full
        options:
          - full
          - code
          - none

permissions:
  contents: read

concurrency:
  group: vidsize-play-closed-test-signed
  cancel-in-progress: false

jobs:
  signed-closed-test:
    name: Build and verify the production artifacts
    runs-on: ubuntu-latest

    env:
      VIDSIZE_UPLOAD_STORE_PASSWORD: ${{ secrets.VIDSIZE_UPLOAD_STORE_PASSWORD }}
      VIDSIZE_UPLOAD_KEY_ALIAS: ${{ secrets.VIDSIZE_UPLOAD_KEY_ALIAS }}
      VIDSIZE_UPLOAD_KEY_PASSWORD: ${{ secrets.VIDSIZE_UPLOAD_KEY_PASSWORD }}
      VIDSIZE_UPLOAD_KEYSTORE_TYPE: ${{ secrets.VIDSIZE_UPLOAD_KEYSTORE_TYPE }}
      VIDSIZE_UPLOAD_CERT_SHA256: ${{ secrets.VIDSIZE_UPLOAD_CERT_SHA256 }}

      # This is the release path, so a missing AdMob secret is a build failure
      # rather than an "ads off" configuration. Without this the closedTest
      # variant packages happily with the whole ads subsystem shrunk away by R8,
      # which is correct for the unsigned audit AAB and catastrophic here: a
      # signed, uploadable, revenue-free bundle that nothing complains about.
      VIDSIZE_REQUIRE_ADS: "true"

      # "full" for every ordinary run. A dispatch can weaken it one step at a
      # time: "code" keeps code shrinking and drops resource shrinking, "none"
      # drops both. Two builds separate a missing keep rule from a stripped
      # resource without a debugger.
      VIDSIZE_SHRINK: "${{ inputs.shrink || 'full' }}"

      # AdMob identifiers. Five are required; a blank one switches off EVERY
      # format, banners included, and verifyProductionAdConfig names it.
      VIDSIZE_ADMOB_APP_ID: ${{ secrets.VIDSIZE_ADMOB_APP_ID }}
      VIDSIZE_HOME_BANNER_AD_UNIT_ID: ${{ secrets.VIDSIZE_HOME_BANNER_AD_UNIT_ID }}
      VIDSIZE_NATIVE_RESULT_AD_UNIT_ID: ${{ secrets.VIDSIZE_NATIVE_RESULT_AD_UNIT_ID }}
      VIDSIZE_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.VIDSIZE_INTERSTITIAL_AD_UNIT_ID }}
      VIDSIZE_REWARDED_AD_UNIT_ID: ${{ secrets.VIDSIZE_REWARDED_AD_UNIT_ID }}
      # Optional. Unset is a supported state: app-open stays off, and the
      # compression screen reuses the home banner unit.
      VIDSIZE_APP_OPEN_AD_UNIT_ID: ${{ secrets.VIDSIZE_APP_OPEN_AD_UNIT_ID }}
      VIDSIZE_COMPRESSION_BANNER_AD_UNIT_ID: ${{ secrets.VIDSIZE_COMPRESSION_BANNER_AD_UNIT_ID }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v5

      - name: Prepare secure signing path
        shell: bash
        run: |
          set -euo pipefail
          echo "VIDSIZE_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/vidsize-play-upload.p12" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.vidsize.compressor"' app/build.gradle.kts
          version_code="$(awk '/versionCode = /{print $3; exit}' app/build.gradle.kts)"
          version_name="$(awk -F'"' '/versionName = /{print $2; exit}' app/build.gradle.kts)"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq 'create("closedTest")' app/build.gradle.kts
          grep -Fq 'initWith(getByName("release"))' app/build.gradle.kts
          grep -Fq 'buildConfigField("boolean", "USE_TEST_ADS", "false")' app/build.gradle.kts
          grep -Fq 'buildConfigField("boolean", "ENABLE_ADS", "$adsConfigured")' app/build.gradle.kts
          grep -Fq 'isMinifyEnabled = true' app/build.gradle.kts
          grep -Fq 'isShrinkResources = true' app/build.gradle.kts
          grep -Fq 'verifyClosedTestSigningConfig' app/build.gradle.kts
          grep -Fq 'verifyProductionAdConfig' app/build.gradle.kts
          echo "Version: $version_name ($version_code)"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Validate signing secrets
        shell: bash
        env:
          VIDSIZE_UPLOAD_KEYSTORE_B64: ${{ secrets.VIDSIZE_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for value in \
            "$VIDSIZE_UPLOAD_KEYSTORE_B64" \
            "$VIDSIZE_UPLOAD_STORE_PASSWORD" \
            "$VIDSIZE_UPLOAD_KEY_ALIAS" \
            "$VIDSIZE_UPLOAD_KEY_PASSWORD" \
            "$VIDSIZE_UPLOAD_KEYSTORE_TYPE" \
            "$VIDSIZE_UPLOAD_CERT_SHA256"
          do
            test -n "$value" || {
              echo "Required Play upload signing secret is missing." >&2
              exit 1
            }
          done

          printf '%s' "$VIDSIZE_UPLOAD_KEYSTORE_B64" | base64 --decode \
            > "$VIDSIZE_UPLOAD_KEYSTORE_PATH"
          chmod 600 "$VIDSIZE_UPLOAD_KEYSTORE_PATH"
          test -s "$VIDSIZE_UPLOAD_KEYSTORE_PATH"

          actual="$(
            keytool -list -v \
              -keystore "$VIDSIZE_UPLOAD_KEYSTORE_PATH" \
              -storetype "$VIDSIZE_UPLOAD_KEYSTORE_TYPE" \
              -storepass "$VIDSIZE_UPLOAD_STORE_PASSWORD" \
              -alias "$VIDSIZE_UPLOAD_KEY_ALIAS" 2>/dev/null \
            | awk '/SHA256:/{print $2; exit}'
          )"

          test -n "$actual"
          if [ "$actual" != "$VIDSIZE_UPLOAD_CERT_SHA256" ]; then
            echo "Upload certificate fingerprint mismatch." >&2
            echo "Expected: $VIDSIZE_UPLOAD_CERT_SHA256" >&2
            echo "Actual  : $actual" >&2
            exit 1
          fi

          echo "Upload certificate SHA256 verified: $actual"

      - name: Unit tests and signed closed-test runtime gate
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:testDebugUnitTest \
            :app:lintClosedTest \
            :app:verifyClosedTestSigningConfig \
            :app:verifyProductionAdConfig \
            :app:verifyAdUnitCoverage \
            :app:verifyRewardCopyParity \
            :app:bundleClosedTest \
            :app:assembleClosedTest \
            --stacktrace

          # Both outputs come from the SAME variant and the same R8 pass.
          #
          # The AAB is what Play accepts. The APK exists because an AAB cannot be
          # installed on a phone directly, and the one thing this build is for is
          # being run on real hardware before it reaches anyone: R8 and resource
          # shrinking are ON here and nowhere the developer has tested so far.
          # Without an installable artifact that check needs a Play upload and a
          # round trip through internal testing, which is the friction that gets
          # it skipped.

      - name: Verify AAB signature and signer certificate
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          aab="$(
            find app/build/outputs/bundle/closedTest \
              -maxdepth 1 -type f -name '*.aab' -print -quit
          )"
          test -n "$aab"
          test -s "$aab"

          jarsigner -verify -verbose -certs "$aab" >/dev/null

          bundle_fp="$(
            keytool -printcert -jarfile "$aab" 2>/dev/null \
            | awk '/SHA256:/{print $2; exit}'
          )"

          test -n "$bundle_fp"
          if [ "$bundle_fp" != "$VIDSIZE_UPLOAD_CERT_SHA256" ]; then
            echo "Signed AAB certificate mismatch." >&2
            echo "Expected: $VIDSIZE_UPLOAD_CERT_SHA256" >&2
            echo "Actual  : $bundle_fp" >&2
            exit 1
          fi

          version_name="$(awk -F'"' '/versionName = /{print $2; exit}' app/build.gradle.kts)"
          version_code="$(awk '/versionCode = /{print $3; exit}' app/build.gradle.kts)"
          compact="${version_name//./}"

          apk="$(
            find app/build/outputs/apk/closedTest \
              -maxdepth 1 -type f -name '*.apk' -print -quit
          )"
          test -n "$apk"
          test -s "$apk"
          apksigner verify --print-certs "$apk" >/dev/null 2>&1 \
            || jarsigner -verify "$apk" >/dev/null

          mkdir -p release
          output="release/Vidsize-${version_name}-production.aab"
          apk_output="release/Vidsize-${version_name}-production.apk"
          cp "$aab" "$output"
          cp "$apk" "$apk_output"

          sha256="$(sha256sum "$output" | awk '{print $1}')"
          apk_sha256="$(sha256sum "$apk_output" | awk '{print $1}')"

          # --- Ads present in the artifact, measured rather than asserted -----
          #
          # This block used to be three hardcoded echo lines claiming ads were
          # enabled. They printed the same text whatever was in the bundle, so
          # the one document a reviewer reads before uploading to Play was the
          # one place guaranteed not to notice an ads-free build. A report that
          # cannot be wrong cannot be evidence.
          #
          # ## What the first version of this block got wrong
          #
          # It also failed the build when ANY class under the ads package showed
          # R8$$REMOVED$$CLASS$$ in the obfuscation map. That conflates two
          # different things. A class disappears from the map both when it was
          # dead code AND when R8 inlined all of it into its callers - and
          # inlining small Kotlin objects is exactly what R8 is supposed to do.
          #
          # The first real production run proved it: the build was correct in
          # every other respect and was rejected because AdSlots,
          # FullScreenPacingPolicy and NativeAdLoader had been inlined. The
          # giveaway was in the same run - AdGate and AdIds, which ARE removed
          # in an ads-off build, were present, and the native ad layout had
          # survived resource shrinking, which only happens while something
          # still references R.layout.native_ad_result.
          #
          # A gate that blocks a good artifact is not a strict gate, it is a
          # broken one. So the removed-class list is now reported and not
          # judged, and the three hard checks below are things that cannot be
          # true unless the ads path really was compiled in.
          #
          #  1. The merged manifest carries the AdMob app id this run was
          #     configured with. When identifiers are absent Gradle substitutes
          #     Google's sample id as an inert placeholder, so the configured
          #     value being present is positive proof, not an absence.
          #  2. That sample publisher is nowhere in the manifest.
          #  3. base/res/layout/native_ad_result.xml is packaged. Resource
          #     shrinking drops it the moment no surviving code inflates it, so
          #     its presence proves the result-screen native ad - the placement
          #     that pays - is still wired.
          manifest="$(unzip -p "$output" base/manifest/AndroidManifest.xml | tr -d '\000')"
          map="$(
            unzip -p "$output" \
              BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map \
              2>/dev/null || true
          )"

          # The app id is matched by SHAPE first and only then compared.
          #
          # This was `grep -c -F "$VIDSIZE_ADMOB_APP_ID"`, which degenerates the
          # moment the configured value is not an identifier: with every secret
          # stored as "-" the fixed-string search matched nearly every line of
          # the manifest and the check reported success over a bundle whose
          # AdMob application id was a hyphen. A check whose strength depends on
          # the input being already correct is not a check.
          manifest_app_id="$(
            printf '%s' "$manifest" \
              | grep -a -o -E 'ca-app-pub-[0-9]{16}~[0-9]{10}' | head -1 || true
          )"
          sample_hits="$(printf '%s' "$manifest" | grep -a -c '3940256099942544' || true)"
          native_layout="$(
            unzip -l "$output" | grep -c 'base/res/layout/native_ad_result\.xml' || true
          )"

          ads_failures=0
          if [ -z "$manifest_app_id" ]; then
            echo "FAIL: no well-formed AdMob app id in the merged manifest." >&2
            echo "      Expected ca-app-pub-<16 digits>~<10 digits>." >&2
            ads_failures=1
          elif [ -n "${VIDSIZE_ADMOB_APP_ID:-}" ] \
               && [ "$manifest_app_id" != "$VIDSIZE_ADMOB_APP_ID" ]; then
            echo "FAIL: the manifest app id is not the configured one." >&2
            ads_failures=1
          fi
          if [ "$sample_hits" -ne 0 ]; then
            echo "FAIL: the merged manifest carries Google's sample AdMob app id." >&2
            echo "      The build ran without real identifiers." >&2
            ads_failures=1
          fi
          if [ "$native_layout" -eq 0 ]; then
            echo "FAIL: base/res/layout/native_ad_result.xml is not in the bundle." >&2
            echo "      The result-screen native ad cannot render." >&2
            ads_failures=1
          fi
          if [ "$ads_failures" -ne 0 ]; then
            echo "" >&2
            echo "Refusing to publish an artifact that cannot serve ads." >&2
            exit 1
          fi

          # Reported for the record, never judged. Read it as "R8 inlined or
          # dropped these"; both are normal in a build that passed the three
          # checks above, and the list is here so a future change in it is
          # visible rather than invisible.
          inlined="$(
            printf '%s\n' "$map" \
              | grep -E '^com\.vidsize\.compressor\.ads\..* -> R8\$\$REMOVED' \
              | sed 's/ -> .*//' || true
          )"

          {
            if [ "${VIDSIZE_SHRINK:-full}" != "full" ]; then
              echo "*** DIAGNOSTIC BUILD - DO NOT UPLOAD TO PLAY ***"
              echo "Shrinking was weakened on purpose (VIDSIZE_SHRINK=$VIDSIZE_SHRINK)"
              echo "to isolate a launch crash. This is not the release artifact."
              echo ""
            fi
            echo "Application ID: com.vidsize.compressor"
            echo "Version name: $version_name"
            echo "Version code: $version_code"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Upload certificate SHA256: $bundle_fp"
            echo "AAB SHA256: $sha256"
            echo "APK SHA256: $apk_sha256"
            echo ""
            echo "Variant: closedTest - this IS the production build."
            echo "  It is initWith(release), carries no applicationId suffix, is"
            echo "  not debuggable, and ships the real AdMob units. The debug and"
            echo "  adsQa artifacts produced by the QA workflow are test builds"
            echo "  (.debug / .adsqa suffixes) and are never uploaded anywhere."
            echo ""
            echo "Ads mode: enabled - verified against this bundle, not assumed"
            echo "  Configured AdMob app id in manifest: present (checked)"
            echo "  Google sample app id in manifest: absent (checked)"
            echo "  base/res/layout/native_ad_result.xml: present (checked)"
            echo "  Ad classes inlined or dropped by R8 (informational):"
            if [ -n "$inlined" ]; then
              printf '%s\n' "$inlined" | sed 's/^/    /'
            else
              echo "    none"
            fi
            echo "Ad units: production (Google sample identifiers rejected by Gradle gate)"
            case "${VIDSIZE_SHRINK:-full}" in
              full) echo "R8: enabled";          echo "Resource shrinking: enabled" ;;
              code) echo "R8: enabled";          echo "Resource shrinking: DISABLED (diagnostic)" ;;
              *)    echo "R8: DISABLED (diagnostic)"; echo "Resource shrinking: DISABLED (diagnostic)" ;;
            esac
          } > release/SIGNING-REPORT.txt

          if [ "${VIDSIZE_SHRINK:-full}" = "full" ]; then
            artifact_name="Vidsize-${version_name}-production"
          else
            artifact_name="Vidsize-${version_name}-DIAGNOSTIC-shrink-${VIDSIZE_SHRINK}"
          fi
          echo "artifact=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "file=$output" >> "$GITHUB_OUTPUT"
          echo "apk=$apk_output" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

          echo "Signed AAB (upload to Play): $output"
          echo "AAB SHA256: $sha256"
          echo "Signed APK (install on a phone): $apk_output"
          echo "APK SHA256: $apk_sha256"

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            ${{ steps.meta.outputs.apk }}
            ${{ steps.meta.outputs.file }}
            release/SIGNING-REPORT.txt
          if-no-files-found: error
          retention-days: 30
